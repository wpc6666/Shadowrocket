苹果服务 = select,DIRECT,PROXY,🇭🇰 香港,🇨🇳 台湾,🇯🇵 日本,🇸🇬 新加坡,🇺🇸 美国,select=0
游戏平台 = select,DIRECT,PROXY,🇭🇰 香港,🇯🇵 日本,🇺🇸 美国,select=0
兜底分流 = select,DIRECT,PROXY,🇭🇰 香港,🇨🇳 台湾,🇯🇵 日本,🇸🇬 新加坡,🇺🇸 美国,select=1

